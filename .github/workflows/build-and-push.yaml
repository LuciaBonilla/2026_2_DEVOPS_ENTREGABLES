name: Build and Push Docker Image

on:
  push:
    branches: [ ci-pipeline-lucia ]
  workflow_dispatch:        # permite ejecución manual desde la UI

permissions:
  contents: read            # principio de mínimo privilegio

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        version: [ "1.0.0", "2.0.0" ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authentication in DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./v${{ matrix.version }}
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-validator-api:${{ matrix.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/ci-validator-api:${{ matrix.version }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max