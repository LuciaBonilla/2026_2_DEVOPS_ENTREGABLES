apiVersion: v1
kind: Service
metadata:
  name: ci-validator-api
spec:
  type: NodePort
  selector:
    app: ci-validator-api
    version: blue
  ports:
    - port: 5000        # Puerto en la IP virtual interna del clúster (ClusterIP).
      targetPort: 8000  # Puerto en la IP del pod (PodIP); 8000 es el puerto de Uvicorn (servidor web ASGI para Python).
      nodePort: 30000   # Puerto en la IP del nodo (NodeIP).