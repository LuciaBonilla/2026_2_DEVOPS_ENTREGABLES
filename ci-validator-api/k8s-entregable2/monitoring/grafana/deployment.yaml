apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:13.0
        ports:
        - containerPort: 3000 # Puerto en la IP del pod (GrafanaPodIP); 3000 es el puerto por defecto de Grafana.
