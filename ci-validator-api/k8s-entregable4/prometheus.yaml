# Reemplaza (mismo nombre) el ClusterRole y el ConfigMap de Prometheus de k8s-entregable2.
# Cambios: permisos para leer cAdvisor y job "cadvisor" (CPU/memoria por pod).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["list", "watch"]
- apiGroups: [""]
  resources: ["nodes/proxy", "nodes/metrics"]
  verbs: ["get"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yaml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yaml

    scrape_configs:
      - job_name: ci-validator-api
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: ci-validator-api
        metrics_path: /metrics

      # NUEVO entregable 4: métricas de contenedores (container_cpu_*, container_memory_*) que expone
      # cAdvisor dentro del kubelet. Se leen vía el API server (proxy) con el token del ServiceAccount.
      - job_name: cadvisor
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        authorization:
          credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            regex: (.+)
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor

  alert-rules.yaml: |
    groups:
      - name: ci-validator-api
        rules:
          - alert: CIValidatorAltoVolumen
            expr: sum(increase(ci_validator_validations_total[2m])) > 40
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Más de 40 validaciones de cédula en 2 minutos"
              description: "Se registraron {{ $value | printf \"%.0f\" }} validaciones en los últimos 2 minutos (umbral: 40), sumando todos los pods y todos los resultados."

          - alert: CIValidatorSinTargets
            expr: absent(up{job="ci-validator-api"} == 1)
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Prometheus no puede leer métricas de ci-validator-api"
              description: "Ningún pod de ci-validator-api responde en /metrics desde hace más de 1 minuto."
