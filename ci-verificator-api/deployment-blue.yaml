apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-verificator-api-blue
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ci-verificator-api
      version: blue

  template:
    metadata:
      labels:
        app: ci-verificator-api
        version: blue
    spec:
      containers:
      - name: ci-verificator-api-container
        image: ci-verificator-api:1.0.0
        ports:
        - containerPort: 8000