apiVersion: apps/v1
kind: Deployment
metadata:
  name: ci-validator-api-blue
spec:
  replicas: 1

  selector:
    matchLabels:
      app: ci-validator-api
      version: blue

  template:
    metadata:
      labels:
        app: ci-validator-api
        version: blue
    spec:
      containers:
      - name: ci-validator-api-container
        image: ci-validator-api:1.0.0
        ports:
        - containerPort: 8000 # Puerto en la IP del pod (PodIP); 8000 es el puerto de Uvicorn (servidor web ASGI para Python).
        resources:
          requests:           # Lo que el scheduler reserva en el nodo para ubicar el pod.
            cpu: 50m          # 5 % de un núcleo.
            memory: 64Mi
          limits:             # El máximo que puede consumir el contenedor.
            cpu: 500m         # Si lo supera, el kernel lo frena (throttling); no se reinicia.
            memory: 128Mi     # Si lo supera, el kernel mata el proceso (OOMKilled) y el kubelet lo reinicia.