apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v3.15.0
        args:
        - "--config.file=/etc/prometheus/prometheus.yaml"
        ports:
        - containerPort: 9090 # Puerto en la IP del pod (PrometheusServerPodIP); 9090 es el puerto por defecto de Prometheus Server.
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
