apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector:
    app: prometheus
  ports:
  - port: 9090        # Puerto en la IP virtual interna del clúster (PrometheusServerClusterIP).
    targetPort: 9090  # Puerto en la IP del pod (PrometheusServerPodIP); 9090 es el puerto por defecto de Prometheus Server.
    nodePort: 30002   # Puerto en la IP del nodo (NodeIP).
