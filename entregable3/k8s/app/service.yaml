apiVersion: v1
kind: Service
metadata:
  name: ci-validator-api
spec:
  type: NodePort
  selector:
    app: ci-validator-api
  ports:
    - port: 5000        # Puerto en la IP virtual interna del clúster (AppClusterIP).
      targetPort: http  # Puerto con nombre "http" del contenedor (8000, Uvicorn).
      nodePort: 30001   # Puerto en la IP del nodo (NodeIP).
