apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: ci-validator-api
        kubernetes_sd_configs:
          - role: pod                       # Descubre automáticamente los pods.
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep                    # Se queda sólo con los pods app=ci-validator-api.
            regex: ci-validator-api
        metrics_path: /metrics